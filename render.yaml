services:
  - type: web
    name: customer-churn-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: INTERVENTION_COST
        value: "10"
      - key: RETAINED_VALUE
        value: "120"
      - key: INTERVENTION_EFFECT
        value: "0.35"
